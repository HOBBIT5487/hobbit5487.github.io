        .user-btn {

        }

        .stat-val { color: #38bdf8; font-size: 18px; }

        .stage {
            height: 160px;
            background: linear-gradient(180deg, #1e293b 0%, #450a0a 100%);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            border: 2px solid #991b1b;
            overflow: hidden;
        }

        .arrow-display {
            font-size: 75px;
            line-height: 1;
            transition: transform 0.05s ease-out;

            text-shadow: 0 0 20px rgba(248, 113, 113, 0.6);
        }

        .target-hint { font-size: 18px; color: #e2e8f0; margin-top: 5px; font-weight: bold; }
        .combo-badge { position: absolute; top: 10px; right: 15px; font-size: 14px; color: #f59e0b; font-weight: bold; }
        .speed-badge { position: absolute; top: 10px; left: 15px; font-size: 12px; color: #ef4444; font-weight: bold; }

        .feedback-text { height: 24px; font-weight: bold; font-size: 15px; margin-bottom: 15px; }
        .correct { color: #34d399; }
        .wrong { color: #f87171; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 210px;
            margin: 0 auto;
        }

        .btn-arrow {
            background-color: #334155;
            color: white;
            border: 2px solid #ef4444;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .btn-arrow:active { background-color: #ef4444; }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .start-btn {
            width: 100%;
            padding: 14px;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .start-btn:hover { background-color: #dc2626; }
        .instruction { font-size: 12px; color: #94a3b8; margin-top: 12px; }

        .leaderboard-section {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            text-align: left;
            border: 1px solid #334155;
        }

        .leaderboard-title { color: #f59e0b; font-weight: bold; margin-bottom: 8px; text-align: center; font-size: 14px; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 4px 6px; color: #cbd5e1; border-bottom: 1px solid #1e293b; }
        .leaderboard-item:last-child { border-bottom: none; }
        .rank-number { font-weight: bold; color: #f59e0b; width: 25px; }

<script>
    const firebaseConfig = {
       apiKey: "AIzaSyBBzm8aH-Y1SDq85NBdb9R1P0w7QC7U_RU",
        authDomain: "javelin-game.firebaseapp.com",
        projectId: "javelin-game",
        storageBucket: "javelin-game.firebasestorage.app",
        messagingSenderId: "112956162429",
        appId: "1:112956162429:web:09b88bd544c48f9200cc14",
        measurementId: "G-FZ1MGBTGDE"
    };

    // 初始化 Firebase 與 Firestore
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- 遊戲設定 ---
    const GAME_DURATION = 20;       
    const INITIAL_REFRESH = 1200;   
    const MIN_REFRESH = 350;        
    const BASE_DISTANCE = 1.8;      
    const PENALTY_WRONG = -3.0;     
    const PENALTY_TIMEOUT = -2.0;   

    const keyMap = {
        'ArrowUp': 'ArrowUp', 'w': 'ArrowUp', 'W': 'ArrowUp',
        'ArrowDown': 'ArrowDown', 's': 'ArrowDown', 'S': 'ArrowDown',
        'ArrowLeft': 'ArrowLeft', 'a': 'ArrowLeft', 'A': 'ArrowLeft',
        'ArrowRight': 'ArrowRight', 'd': 'ArrowRight', 'D': 'ArrowRight'
    };

    const dirMap = {
        'ArrowUp': { text: '向上 ⬆️ (W)', icon: '⬆️' },
        'ArrowDown': { text: '向下 ⬇️ (S)', icon: '⬇️' },
        'ArrowLeft': { text: '向左 ⬅️ (A)', icon: '⬅️' },
        'ArrowRight': { text: '向右 ➡️ (D)', icon: '➡️' }
    };

    const directions = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

    let distance = 0.00;
    let combo = 0;
    let timeLeft = GAME_DURATION;
    let currentTarget = null;
    let isPlaying = false;
    let gameTimer = null;
    let refreshTimer = null;
    let currentRefreshRate = INITIAL_REFRESH;
    let currentPlayerName = "訪客";

    const arrowEl = document.getElementById('arrow-display');
    const targetTextEl = document.getElementById('target-text');
    const distanceEl = document.getElementById('distance');
    const timeEl = document.getElementById('time');
    const feedbackEl = document.getElementById('feedback');
    const comboEl = document.getElementById('combo-display');
    const speedEl = document.getElementById('speed-display');
    const startBtn = document.getElementById('start-btn');
    const usernameDisplay = document.getElementById('username-display');
    const leaderboardList = document.getElementById('leaderboard-list');

    window.onload = function() {
        let savedName = localStorage.getItem('javelin_player_name');
        if (savedName) {
            currentPlayerName = savedName;
            usernameDisplay.innerText = currentPlayerName;
        } else {
            setPlayerName();
        }
        // 即時監聽雲端排行榜
        listenToGlobalLeaderboard();
    };

    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (keyMap[e.key]) handleInput(keyMap[e.key]);
    });

    function setPlayerName() {
        let name = prompt("請輸入您的全球玩家名稱：", currentPlayerName);
        if (name && name.trim() !== "") {
            currentPlayerName = name.trim();
            localStorage.setItem('javelin_player_name', currentPlayerName);
            usernameDisplay.innerText = currentPlayerName;
        }
    }

    function startGame() {
        distance = 0.00;
        combo = 0;
        timeLeft = GAME_DURATION;
        currentRefreshRate = INITIAL_REFRESH;
        isPlaying = true;
        updateUI();
        startBtn.style.display = 'none';
        feedbackEl.innerText = '';

        gameTimer = setInterval(() => {
            timeLeft--;
            timeEl.innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);

        nextTarget();
    }

    function nextTarget() {
        if (!isPlaying) return;
        clearTimeout(refreshTimer);

        let progress = (GAME_DURATION - timeLeft) / GAME_DURATION; 
        currentRefreshRate = Math.max(MIN_REFRESH, INITIAL_REFRESH - (progress * 850));
        speedEl.innerText = `等待: ${(currentRefreshRate / 1000).toFixed(2)}s`;

        let newTarget;
        do {
            newTarget = directions[Math.floor(Math.random() * directions.length)];
        } while (newTarget === currentTarget);
        
        currentTarget = newTarget;

        arrowEl.innerText = dirMap[currentTarget].icon;
        targetTextEl.innerText = dirMap[currentTarget].text;

        refreshTimer = setTimeout(() => {
            if (isPlaying) {
                combo = 0; 
                distance = Math.max(0, distance + PENALTY_TIMEOUT);
                updateUI();
                showFeedback('反應太慢！Combo斷了 -2.0m', 'wrong');
                nextTarget();
            }
        }, currentRefreshRate);
    }

    function handleInput(inputDir) {
        if (!isPlaying) return;

        if (inputDir === currentTarget) {
            combo++;
            let bonus = (combo > 10) ? (combo * 0.12) : (combo * 0.05);
            let gain = BASE_DISTANCE + bonus;
            distance += gain;
            showFeedback(`精準！ +${gain.toFixed(2)}m`, 'correct');
        } else {
            combo = 0; 
            distance = Math.max(0, distance + PENALTY_WRONG);
            showFeedback('失誤爆扣！Combo歸零 -3.0m', 'wrong');
        }

        updateUI();
        nextTarget();
    }

    function updateUI() {
        distanceEl.innerText = distance.toFixed(2);
        comboEl.innerText = `Combo: ${combo}`;
    }

    function showFeedback(text, type) {
        feedbackEl.innerText = text;
        feedbackEl.className = 'feedback-text ' + type;
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameTimer);
        clearTimeout(refreshTimer);
        
        arrowEl.innerText = '🏁';
        targetTextEl.innerText = '比賽結束！';
        
        let finalDist = parseFloat(distance.toFixed(2));
        
        // 自動上傳成績至 Firebase 雲端資料庫
        uploadScoreToCloud(currentPlayerName, finalDist);

        let evalText = (finalDist >= 98.48) ? '🏆 破世界紀錄！' : (finalDist >= 80) ? '🥇 奧運金牌！' : '🥉 繼續加油！';
        feedbackEl.innerText = `${evalText} (${finalDist}m)`;
        feedbackEl.className = 'feedback-text correct';
        startBtn.innerText = '重新挑戰';
        startBtn.style.display = 'block';
    }

    // 📤 上傳成績至雲端
    function uploadScoreToCloud(name, score) {
        db.collection("leaderboard").add({
            name: name,
            score: score,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            console.log("成績已即時同步上傳至雲端！");
        }).catch((error) => {
            console.error("上傳失敗: ", error);
        });
    }

    // 📥 即時監聽全球排行榜 Top 5
    function listenToGlobalLeaderboard() {
        db.collection("leaderboard")
          .orderBy("score", "desc")
          .limit(5)
          .onSnapshot((snapshot) => {
              leaderboardList.innerHTML = '';
              let rank = 1;
              snapshot.forEach((doc) => {
                  let data = doc.data();
                  let row = document.createElement('div');
                  row.className = 'leaderboard-item';
                  row.innerHTML = `
                      <span><span class="rank-number">${rank}.</span> ${data.name}</span>
                      <span style="color:#34d399; font-weight:bold;">${data.score.toFixed(2)}m</span>
                  `;
                  leaderboardList.appendChild(row);
                  rank++;
              });
          });
    }
</script>
<div class="ad-sidebar">
        <span>廣告區域 (右)</span>
    </div>

</body>
