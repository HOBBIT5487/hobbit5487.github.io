<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極速反應標槍競技場</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
            gap: 20px;
        }

        .game-container {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 25px;
            width: 440px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 2px solid #334155;
            position: relative;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #94a3b8;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
        }

        .user-stats-line {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #94a3b8;
        }

        .coin-display {
            color: #f59e0b;
            font-weight: bold;
        }

        .user-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .user-btn:hover { background: #1d4ed8; }
        .user-btn.logout-btn { background: #475569; }
        .user-btn.logout-btn:hover { background: #334155; }

        h1 { font-size: 20px; margin-bottom: 15px; color: #f87171; letter-spacing: 1px; }

        .stats-board {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }

        .stat-val { color: #38bdf8; font-size: 18px; }

        .stage {
            height: 260px;
            background: linear-gradient(180deg, #1e293b 0%, #064e3b 100%);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            border: 2px solid #059669;
            overflow: hidden;
        }

        .arrow-display {
            font-size: 70px;
            line-height: 1;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .target-hint { font-size: 16px; color: #e2e8f0; margin-top: 8px; font-weight: bold; }
        .combo-badge { position: absolute; top: 10px; right: 15px; font-size: 13px; color: #f59e0b; font-weight: bold; z-index: 2; }

        /* 🏟️ SVG 完美扇形與交錯環狀草地、白線 */
        .throwing-field {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            top: 0;
            left: 0;
            background: #14532d;
            overflow: hidden;
        }

        .svg-field {
            width: 100%;
            height: 100%;
        }

        /* 標槍飛行動畫物件 */
        .flying-javelin {
            position: absolute;
            width: 26px;
            height: 7px;
            background: linear-gradient(90deg, #f8fafc 0%, #cbd5e1 75%, #dc2626 100%);
            border-radius: 3px;
            transform-origin: center center;
            z-index: 10;
            box-shadow: 0 3px 6px rgba(0,0,0,0.7);
            opacity: 0;
        }
        .flying-javelin::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 0px;
            border-top: 3px solid transparent;
            border-bottom: 3px solid transparent;
            border-left: 6px solid #f8fafc;
        }

        .skip-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 30;
            transition: background 0.2s;
        }
        .skip-btn:hover { background: #38bdf8; color: #0f172a; }

        .feedback-text { height: 24px; font-weight: bold; font-size: 15px; margin-bottom: 15px; }
        .correct { color: #34d399; }
        .wrong { color: #f87171; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 210px;
            margin: 0 auto;
        }

        .btn-arrow {
            background-color: #334155;
            color: white;
            border: 2px solid #ef4444;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .btn-arrow:active { background-color: #ef4444; }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .start-btn {
            width: 100%;
            padding: 14px;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        .start-btn:hover { background-color: #dc2626; }
        .instruction { font-size: 12px; color: #94a3b8; margin-top: 12px; }

        .leaderboard-section {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            text-align: left;
            border: 1px solid #334155;
        }

        .leaderboard-title { color: #f59e0b; font-weight: bold; margin-bottom: 8px; text-align: center; font-size: 14px; letter-spacing: 0.5px; }
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; color: #cbd5e1; border-bottom: 1px solid #1e293b; }
        .leaderboard-item:last-child { border-bottom: none; }
        .rank-number { font-weight: bold; color: #f59e0b; width: 20px; }
        .player-meta { display: flex; flex-direction: column; }
        .player-name { font-weight: bold; color: #f8fafc; font-size: 14px; }
        .player-uid { font-size: 10px; color: #64748b; }

        .ad-sidebar {
            width: 160px;
            min-height: 600px;
            background-color: #1e293b;
            border: 2px dashed #334155;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .ad-sidebar { display: none; }
        }
    </style>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9119320101137247" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="ad-sidebar">
        <span>廣告區域</span>
    </div>

    <div class="game-container">
        <div class="user-bar">
            <div class="user-info">
                <div class="user-header">
                    <img id="user-avatar" class="user-avatar" src="" alt="頭像">
                    <div>玩家: <strong id="username-display" style="color:#38bdf8;">訪客</strong></div>
                </div>
                <div class="user-stats-line">
                    <span id="uid-subtext">UID: 未登入</span>
                    <span class="coin-display">💰 金幣: <span id="coin-count">0</span></span>
                </div>
            </div>
            <div style="display: flex; gap: 5px; flex-direction: column; align-items: flex-end;">
                <button id="edit-name-btn" class="user-btn" style="display:none; background:#0284c7; padding: 3px 8px; font-size: 11px;" onclick="customPlayerName()">修改暱稱</button>
                <button id="auth-btn" class="user-btn" onclick="toggleAuth()">Google 登入</button>
            </div>
        </div>

        <h1>極速反應標槍競技場</h1>

        <div class="stats-board">
            <div>剩餘時間: <span id="time" class="stat-val">20</span>s</div>
            <div>投擲成績: <span id="distance" class="stat-val">0.00</span>m</div>
        </div>

        <div class="stage">
            <div id="combo-display" class="combo-badge">連擊: 0</div>
            
            <div id="normal-game-view" style="width: 100%;">
                <div id="arrow-display" class="arrow-display">⬆</div>
                <div id="target-text" class="target-hint">準備開始挑戰</div>
            </div>

            <div id="throwing-field" class="throwing-field">
                <button id="skip-btn" class="skip-btn" onclick="skipAnimation()">跳過動畫</button>
                <svg id="svg-field" class="svg-field" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax meet">
                    </svg>
                <div class="flying-javelin" id="flying-javelin"></div>
            </div>
        </div>

        <div id="feedback" class="feedback-text"></div>

        <div class="controls-grid">
            <button class="btn-arrow btn-up" onclick="handleInput('ArrowUp')">⬆ (W)</button>
            <button class="btn-arrow btn-left" onclick="handleInput('ArrowLeft')">⬅ (A)</button>
            <button class="btn-arrow btn-down" onclick="handleInput('ArrowDown')">⬇ (S)</button>
            <button class="btn-arrow btn-right" onclick="handleInput('ArrowRight')">➡ (D)</button>
        </div>

        <button id="start-btn" class="start-btn" onclick="startGame()">開始挑戰</button>
        <div class="instruction">操作提示：使用方向鍵/WASD 進行反應輸入</div>

        <div class="leaderboard-section">
            <div class="leaderboard-title">全球即時排行榜 TOP 5</div>
            <div id="leaderboard-list">正在連線至雲端伺服器...</div>
        </div>
    </div>

    <div class="ad-sidebar">
        <span>廣告區域</span>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBBzm8aH-Y1SDq85NBdb9R1P0w7QC7U_RU",
        authDomain: "javelin-game.firebaseapp.com",
        projectId: "javelin-game",
        storageBucket: "javelin-game.firebasestorage.app",
        messagingSenderId: "112956162429",
        appId: "1:112956162429:web:09b88bd544c48f9200cc14",
        measurementId: "G-FZ1MGBTGDE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const GAME_DURATION = 20;       
    const INITIAL_REFRESH = 1200;   
    const MIN_REFRESH = 750;        
    const BASE_DISTANCE = 1.8;      
    const PENALTY_WRONG = -3.0;     
    const PENALTY_TIMEOUT = -2.0;   

    const keyMap = {
        'ArrowUp': 'ArrowUp', 'w': 'ArrowUp', 'W': 'ArrowUp',
        'ArrowDown': 'ArrowDown', 's': 'ArrowDown', 'S': 'ArrowDown',
        'ArrowLeft': 'ArrowLeft', 'a': 'ArrowLeft', 'A': 'ArrowLeft',
        'ArrowRight': 'ArrowRight', 'd': 'ArrowRight', 'D': 'ArrowRight'
    };

    const dirMap = {
        'ArrowUp': { text: '向上 (W)', icon: '⬆' },
        'ArrowDown': { text: '向下 (S)', icon: '⬇' },
        'ArrowLeft': { text: '向左 (A)', icon: '⬅' },
        'ArrowRight': { text: '向右 (D)', icon: '➡' }
    };

    const directions = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

    let distance = 0.00;
    let combo = 0;
    let timeLeft = GAME_DURATION;
    let currentTarget = null;
    let isPlaying = false;
    let gameTimer = null;
    let refreshTimer = null;
    let animationTimer = null;
    let currentRefreshRate = INITIAL_REFRESH;
    let currentUser = null;
    let customName = null;
    let userCoins = 0; // 訪客預設0金幣，絕不發放

    const normalGameView = document.getElementById('normal-game-view');
    const throwingField = document.getElementById('throwing-field');
    const svgField = document.getElementById('svg-field');
    const flyingJavelin = document.getElementById('flying-javelin');
    const skipBtn = document.getElementById('skip-btn');
    const arrowEl = document.getElementById('arrow-display');
    const targetTextEl = document.getElementById('target-text');
    const distanceEl = document.getElementById('distance');
    const timeEl = document.getElementById('time');
    const feedbackEl = document.getElementById('feedback');
    const comboEl = document.getElementById('combo-display');
    const startBtn = document.getElementById('start-btn');
    const usernameDisplay = document.getElementById('username-display');
    const uidSubtext = document.getElementById('uid-subtext');
    const userAvatar = document.getElementById('user-avatar');
    const authBtn = document.getElementById('auth-btn');
    const leaderboardList = document.getElementById('leaderboard-list');
    const coinCountEl = document.getElementById('coin-count');

    window.onload = function() {
        updateCoinsUI();
        listenToGlobalLeaderboard();

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                let savedCustomName = localStorage.getItem('javelin_custom_name_' + user.uid);
                customName = savedCustomName || user.displayName || "匿名玩家";
                
                usernameDisplay.innerText = customName;
                uidSubtext.innerText = `UID: ${user.uid.substring(0, 6)}...`;
                if (user.photoURL) {
                    userAvatar.src = user.photoURL;
                    userAvatar.style.display = 'block';
                }
                document.getElementById('edit-name-btn').style.display = 'inline-block';
                authBtn.innerText = "登出";
                authBtn.className = "user-btn logout-btn";

                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (doc.exists && doc.data().coins !== undefined) {
                        userCoins = doc.data().coins;
                    } else {
                        userCoins = 100; // 新登入帳號贈送 100 初始金幣
                        db.collection("users").doc(user.uid).set({ coins: userCoins }, { merge: true });
                    }
                    updateCoinsUI();
                });
            } else {
                currentUser = null;
                customName = null;
                userCoins = 0; // 訪客沒有金幣
                usernameDisplay.innerText = "訪客";
                uidSubtext.innerText = "UID: 未登入";
                userAvatar.style.display = 'none';
                document.getElementById('edit-name-btn').style.display = 'none';
                authBtn.innerText = "Google 登入";
                authBtn.className = "user-btn";
                updateCoinsUI();
            }
        });
    };

    function updateCoinsUI() {
        coinCountEl.innerText = userCoins;
    }

    function addCoins(amount) {
        if (!currentUser) return; // 🌟 嚴格限制：未登入訪客絕對不給金幣！
        userCoins += amount;
        updateCoinsUI();
        db.collection("users").doc(currentUser.uid).set({ coins: userCoins }, { merge: true });
    }

    function toggleAuth() {
        if (currentUser) {
            auth.signOut().then(() => {
                alert("已成功登出");
            });
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                console.error("登入失敗:", error);
                alert("登入失敗，請重試");
            });
        }
    }

    function customPlayerName() {
        if (!currentUser) return;
        let defaultName = customName || currentUser.displayName || "匿名玩家";
        let newName = prompt("請輸入您的遊戲暱稱（可與他人重複）：", defaultName);
        
        if (newName && newName.trim() !== "") {
            customName = newName.trim();
            localStorage.setItem('javelin_custom_name_' + currentUser.uid, customName);
            usernameDisplay.innerText = customName;
            
            db.collection("leaderboard").where("uid", "==", currentUser.uid).get().then((snapshot) => {
                snapshot.forEach((doc) => {
                    doc.ref.update({ name: customName });
                });
            });

            alert("暱稱修改成功");
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (keyMap[e.key]) {
            e.preventDefault();
            handleInput(keyMap[e.key]);
        }
    });

    function startGame() {
        if (animationTimer) clearTimeout(animationTimer);
        distance = 0.00;
        combo = 0;
        timeLeft = GAME_DURATION;
        currentRefreshRate = INITIAL_REFRESH;
        isPlaying = true;
        
        throwingField.style.display = 'none';
        normalGameView.style.display = 'block';

        updateUI();
        startBtn.style.display = 'none';
        feedbackEl.innerText = '';

        gameTimer = setInterval(() => {
            timeLeft--;
            timeEl.innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);

        nextTarget();
    }

    function nextTarget() {
        if (!isPlaying) return;
        if (refreshTimer) clearTimeout(refreshTimer);

        let progress = (GAME_DURATION - timeLeft) / GAME_DURATION; 
        currentRefreshRate = Math.max(MIN_REFRESH, INITIAL_REFRESH - (progress * 750));

        let newTarget;
        do {
            newTarget = directions[Math.floor(Math.random() * directions.length)];
        } while (newTarget === currentTarget);
        
        currentTarget = newTarget;

        arrowEl.innerText = dirMap[currentTarget].icon;
        targetTextEl.innerText = dirMap[currentTarget].text;

        refreshTimer = setTimeout(() => {
            if (isPlaying) {
                combo = 0; 
                distance = Math.max(0, distance + PENALTY_TIMEOUT);
                updateUI();
                showFeedback('反應逾時 連擊中斷 扣 2.0m', 'wrong');
                nextTarget();
            }
        }, currentRefreshRate);
    }

    function handleInput(inputDir) {
        if (!isPlaying) return;
        if (refreshTimer) clearTimeout(refreshTimer);

        if (inputDir === currentTarget) {
            combo++;
            let bonus = (combo > 10) ? (combo * 0.12) : (combo * 0.05);
            let gain = BASE_DISTANCE + bonus;
            distance += gain;
            showFeedback(`命中目標 +${gain.toFixed(2)}m`, 'correct');
        } else {
            combo = 0; 
            distance = Math.max(0, distance + PENALTY_WRONG);
            showFeedback('輸入錯誤 扣 3.0m', 'wrong');
        }

        updateUI();
        nextTarget();
    }

    function updateUI() {
        distanceEl.innerText = distance.toFixed(2);
        comboEl.innerText = `連擊: ${combo}`;
    }

    function showFeedback(text, type) {
        feedbackEl.innerText = text;
        feedbackEl.className = 'feedback-text ' + type;
    }

    // 🎯 使用 SVG 完美繪製扇形交替深淺綠條紋與對齊白線刻度
    function endGame() {
        isPlaying = false;
        clearInterval(gameTimer);
        if (refreshTimer) clearTimeout(refreshTimer);
        
        let finalDist = parseFloat(distance.toFixed(2));
        addCoins(30); // 獎勵發放（訪客絕不給金幣）
        
        normalGameView.style.display = 'none';
        throwingField.style.display = 'block';
        skipBtn.style.display = 'block'; 
        
        let maxScale = Math.max(60, Math.ceil(finalDist / 10) * 10 + 10);
        let maxRadius = 240;
        let svgHTML = '';

        // 投擲起跑圓弧 (底部中心點 200, 260)
        svgHTML += `<path d="M 180 260 A 20 20 0 0 1 220 260 Z" fill="#991b1b" stroke="#f8fafc" stroke-width="3" />`;

        // 繪製扇形環狀深綠/淺綠相間條紋與白線
        for (let m = maxScale; m >= 10; m -= 10) {
            let r = (m / maxScale) * maxRadius;
            let prevR = ((m - 10) / maxScale) * maxRadius;
            let fillColor = (m / 10) % 2 === 0 ? '#15803d' : '#166534'; // 依序深綠淺綠相間

            // 扇形區塊
            svgHTML += `
                <path d="M ${200 - r * 0.55} ${260 - r * 0.84} 
                         A ${r} ${r} 0 0 1 ${200 + r * 0.55} ${260 - r * 0.84} 
                         L ${200 + prevR * 0.55} ${260 - prevR * 0.84} 
                         A ${prevR} ${prevR} 0 0 0 ${200 - prevR * 0.55} ${260 - prevR * 0.84} Z" 
                      fill="${fillColor}" />
            `;

            // 白線弧度直接與該區塊上緣對齊
            svgHTML += `
                <path d="M ${200 - r * 0.55} ${260 - r * 0.84} 
                         A ${r} ${r} 0 0 1 ${200 + r * 0.55} ${260 - r * 0.84}" 
                      stroke="#ffffff" stroke-width="2" fill="none" stroke-opacity="0.9" />
            `;

            // 刻度數字
            svgHTML += `
                <text x="215" y="${260 - r * 0.84 + 4}" fill="#fde047" font-size="10" font-weight="bold">${m}m</text>
            `;
        }

        svgField.innerHTML = svgHTML;

        // 計算標槍落點座標
        flyingJavelin.style.transition = 'none';
        flyingJavelin.style.left = '200px';
        flyingJavelin.style.bottom = '15px';
        flyingJavelin.style.transform = 'translateX(-50%) rotate(-90deg) scale(0.4)';
        flyingJavelin.style.opacity = '1';

        let targetRadius = Math.min(maxRadius, (finalDist / maxScale) * maxRadius);
        let randomAngle = (Math.random() - 0.5) * 0.5;
        let targetX = 200 + targetRadius * Math.sin(randomAngle);
        let targetY = 260 - targetRadius * Math.cos(randomAngle);

        setTimeout(() => {
            flyingJavelin.style.transition = 'all 10s cubic-bezier(0.1, 0.5, 0.2, 1)';
            flyingJavelin.style.bottom = (260 - targetY) + 'px';
            flyingJavelin.style.left = targetX + 'px';
            let finalAngle = -90 - (randomAngle * 57.3) - 25;
            flyingJavelin.style.transform = `translateX(-50%) rotate(${finalAngle}deg) scale(1.1)`;
        }, 100);

        animationTimer = setTimeout(() => {
            finishAnimation(finalDist);
        }, 10000);

        if (currentUser) {
            uploadScoreToCloud(customName || currentUser.displayName || "匿名玩家", finalDist, currentUser.uid);
        }
    }

    function skipAnimation() {
        if (animationTimer) clearTimeout(animationTimer);
        let finalDist = parseFloat(distance.toFixed(2));
        
        let maxScale = Math.max(60, Math.ceil(finalDist / 10) * 10 + 10);
        let targetRadius = Math.min(240, (finalDist / maxScale) * 240);
        let targetX = 200;
        let targetY = 260 - targetRadius;

        flyingJavelin.style.transition = 'none';
        flyingJavelin.style.bottom = (260 - targetY) + 'px';
        flyingJavelin.style.left = targetX + 'px';
        flyingJavelin.style.transform = 'translateX(-50%) rotate(-115deg) scale(1.1)';
        flyingJavelin.style.opacity = '1';

        finishAnimation(finalDist);
    }

    function finishAnimation(finalDist) {
        skipBtn.style.display = 'none';
        let evalText = '挑戰完成';
        
        if (finalDist >= 98.48) {
            evalText = '打破世界紀錄 (+100金幣)';
            addCoins(100); // 破紀錄額外獎勵（限登入）
        } else if (finalDist >= 80) {
            evalText = '奧運金牌水準';
        }

        let loginNotice = currentUser ? "" : " (訪客未登入，未累積金幣)";
        feedbackEl.innerText = `${evalText} 總成績: ${finalDist}m${loginNotice}`;
        feedbackEl.className = 'feedback-text correct';
        startBtn.innerText = '再次挑戰';
        startBtn.style.display = 'block';
    }

    function uploadScoreToCloud(name, score, uid) {
        if (!uid) return;
        const leaderboardRef = db.collection("leaderboard");
        
        leaderboardRef.where("uid", "==", uid).get().then((querySnapshot) => {
            if (!querySnapshot.empty) {
                querySnapshot.forEach((doc) => {
                    let docId = doc.id;
                    let oldScore = doc.data().score;
                    
                    let updateData = { name: name };
                    if (score > oldScore) {
                        updateData.score = score;
                        updateData.timestamp = firebase.firestore.FieldValue.serverTimestamp();
                    }
                    leaderboardRef.doc(docId).update(updateData);
                });
            } else {
                leaderboardRef.add({
                    name: name,
                    score: score,
                    uid: uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }).catch((error) => {
            console.error("雲端同步失敗: ", error);
        });
    }

    function listenToGlobalLeaderboard() {
        db.collection("leaderboard")
          .orderBy("score", "desc")
          .limit(5)
          .onSnapshot((snapshot) => {
              leaderboardList.innerHTML = '';
              let rank = 1;
              snapshot.forEach((doc) => {
                  let data = doc.data();
                  let shortUid = data.uid ? data.uid.substring(0, 6) : "guest";
                  let row = document.createElement('div');
                  row.className = 'leaderboard-item';
                  row.innerHTML = `
                      <div style="display: flex; align-items: center; gap: 8px;">
                          <span class="rank-number">${rank}.</span>
                          <div class="player-meta">
                              <span class="player-name">${data.name}</span>
                              <span class="player-uid">UID: ${shortUid}...</span>
                          </div>
                      </div>
                      <span style="color:#34d399; font-weight:bold; font-size:15px;">${data.score.toFixed(2)}m</span>
                  `;
                  leaderboardList.appendChild(row);
                  rank++;
              });
          });
    }
</script>
