<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>標槍極速反應賽 - 全球線上連線版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
            gap: 20px;
        }

        .game-container {
            background-color: #1e293b;
            border-radius: 20px;
            padding: 25px;
            width: 440px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 2px solid #334155;
            position: relative;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #94a3b8;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: none;
        }

        .user-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .user-btn:hover { background: #3367d6; }
        .user-btn.logout-btn { background: #64748b; }
        .user-btn.logout-btn:hover { background: #475569; }

        h1 { font-size: 22px; margin-bottom: 15px; color: #ef4444; }

        .stats-board {
            display: flex;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }

        .stat-val { color: #38bdf8; font-size: 18px; }

        .stage {
            height: 160px;
            background: linear-gradient(180deg, #1e293b 0%, #450a0a 100%);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 15px;
            border: 2px solid #991b1b;
            overflow: hidden;
        }

        .arrow-display {
            font-size: 75px;
            line-height: 1;
            transition: transform 0.05s ease-out;
            color: #f87171;
            text-shadow: 0 0 20px rgba(248, 113, 113, 0.6);
        }

        .target-hint { font-size: 18px; color: #e2e8f0; margin-top: 5px; font-weight: bold; }
        .combo-badge { position: absolute; top: 10px; right: 15px; font-size: 14px; color: #f59e0b; font-weight: bold; }
        .speed-badge { position: absolute; top: 10px; left: 15px; font-size: 12px; color: #ef4444; font-weight: bold; }

        .feedback-text { height: 24px; font-weight: bold; font-size: 15px; margin-bottom: 15px; }
        .correct { color: #34d399; }
        .wrong { color: #f87171; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 210px;
            margin: 0 auto;
        }

        .btn-arrow {
            background-color: #334155;
            color: white;
            border: 2px solid #ef4444;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .btn-arrow:active { background-color: #ef4444; }
        .btn-up { grid-column: 2; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .start-btn {
            width: 100%;
            padding: 14px;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .start-btn:hover { background-color: #dc2626; }
        .instruction { font-size: 12px; color: #94a3b8; margin-top: 12px; }

        .leaderboard-section {
            margin-top: 20px;
            background: #0f172a;
            border-radius: 10px;
            padding: 12px;
            font-size: 13px;
            text-align: left;
            border: 1px solid #334155;
        }

        .leaderboard-title { color: #f59e0b; font-weight: bold; margin-bottom: 8px; text-align: center; font-size: 14px; }
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; color: #cbd5e1; border-bottom: 1px solid #1e293b; }
        .leaderboard-item:last-child { border-bottom: none; }
        .rank-number { font-weight: bold; color: #f59e0b; width: 20px; }
        .player-meta { display: flex; flex-direction: column; }
        .player-name { font-weight: bold; color: #f8fafc; font-size: 14px; }
        .player-uid { font-size: 10px; color: #64748b; }

        .ad-sidebar {
            width: 160px;
            min-height: 600px;
            background-color: #1e293b;
            border: 2px dashed #334155;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #64748b;
            font-size: 13px;
            text-align: center;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .ad-sidebar { display: none; }
        }
    </style>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9119320101137247" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="ad-sidebar">
        <span>廣告區域 (左)</span>
    </div>

    <div class="game-container">
        <div class="user-bar">
            <div class="user-info">
                <img id="user-avatar" class="user-avatar" src="" alt="頭像">
                <div>
                    <div style="font-size: 11px; color: #64748b;" id="uid-subtext">UID: 未登入</div>
                    <div>玩家: <strong id="username-display" style="color:#38bdf8;">訪客</strong></div>
                </div>
            </div>
            <div style="display: flex; gap: 5px;">
                <button id="edit-name-btn" class="user-btn" style="display:none; background:#0284c7;" onclick="customPlayerName()">改暱稱</button>
                <button id="auth-btn" class="user-btn" onclick="toggleAuth()">Google 登入</button>
            </div>
        </div>

        <h1>🔥 地獄級標槍反應賽</h1>

        <div class="stats-board">
            <div>時間: <span id="time" class="stat-val">20</span>s</div>
            <div>成績: <span id="distance" class="stat-val">0.00</span>m</div>
        </div>

        <div class="stage">
            <div id="speed-display" class="speed-badge">等待: 1.2s</div>
            <div id="combo-display" class="combo-badge">Combo: 0</div>
            <div id="arrow-display" class="arrow-display">🎯</div>
            <div id="target-text" class="target-hint">準備接受挑戰！</div>
        </div>

        <div id="feedback" class="feedback-text"></div>

        <div class="controls-grid">
            <button class="btn-arrow btn-up" onclick="handleInput('ArrowUp')">▲ (W)</button>
            <button class="btn-arrow btn-left" onclick="handleInput('ArrowLeft')">◄ (A)</button>
            <button class="btn-arrow btn-down" onclick="handleInput('ArrowDown')">▼ (S)</button>
            <button class="btn-arrow btn-right" onclick="handleInput('ArrowRight')">► (D)</button>
        </div>

        <button id="start-btn" class="start-btn" onclick="startGame()">開始地獄挑戰</button>
        <div class="instruction">支援按鍵：方向鍵 (⬆️⬇️⬅️➡️) 或 WASD</div>

        <div class="leaderboard-section">
            <div class="leaderboard-title">🌐 全球即時排行榜 (Top 5)</div>
            <div id="leaderboard-list">連線至雲端中...</div>
        </div>
    </div>

    <div class="ad-sidebar">
        <span>廣告區域 (右)</span>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBBzm8aH-Y1SDq85NBdb9R1P0w7QC7U_RU",
        authDomain: "javelin-game.firebaseapp.com",
        projectId: "javelin-game",
        storageBucket: "javelin-game.firebasestorage.app",
        messagingSenderId: "112956162429",
        appId: "1:112956162429:web:09b88bd544c48f9200cc14",
        measurementId: "G-FZ1MGBTGDE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const GAME_DURATION = 20;       
    const INITIAL_REFRESH = 1200;   
    const MIN_REFRESH = 750;        
    const BASE_DISTANCE = 1.8;      
    const PENALTY_WRONG = -3.0;     
    const PENALTY_TIMEOUT = -2.0;   

    const keyMap = {
        'ArrowUp': 'ArrowUp', 'w': 'ArrowUp', 'W': 'ArrowUp',
        'ArrowDown': 'ArrowDown', 's': 'ArrowDown', 'S': 'ArrowDown',
        'ArrowLeft': 'ArrowLeft', 'a': 'ArrowLeft', 'A': 'ArrowLeft',
        'ArrowRight': 'ArrowRight', 'd': 'ArrowRight', 'D': 'ArrowRight'
    };

    const dirMap = {
        'ArrowUp': { text: '向上 ⬆️ (W)', icon: '⬆️' },
        'ArrowDown': { text: '向下 ⬇️ (S)', icon: '⬇️' },
        'ArrowLeft': { text: '向左 ⬅️ (A)', icon: '⬅️' },
        'ArrowRight': { text: '向右 ➡️ (D)', icon: '➡️' }
    };

    const directions = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

    let distance = 0.00;
    let combo = 0;
    let timeLeft = GAME_DURATION;
    let currentTarget = null;
    let isPlaying = false;
    let gameTimer = null;
    let refreshTimer = null;
    let currentRefreshRate = INITIAL_REFRESH;
    let currentUser = null;
    let customName = null;

    const arrowEl = document.getElementById('arrow-display');
    const targetTextEl = document.getElementById('target-text');
    const distanceEl = document.getElementById('distance');
    const timeEl = document.getElementById('time');
    const feedbackEl = document.getElementById('feedback');
    const comboEl = document.getElementById('combo-display');
    const speedEl = document.getElementById('speed-display');
    const startBtn = document.getElementById('start-btn');
    const usernameDisplay = document.getElementById('username-display');
    const uidSubtext = document.getElementById('uid-subtext');
    const userAvatar = document.getElementById('user-avatar');
    const authBtn = document.getElementById('auth-btn');
    const leaderboardList = document.getElementById('leaderboard-list');

    window.onload = function() {
        listenToGlobalLeaderboard();

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                let savedCustomName = localStorage.getItem('javelin_custom_name_' + user.uid);
                customName = savedCustomName || user.displayName || "匿名玩家";
                
                usernameDisplay.innerText = customName;
                uidSubtext.innerText = `UID: ${user.uid.substring(0, 6)}...`;
                if (user.photoURL) {
                    userAvatar.src = user.photoURL;
                    userAvatar.style.display = 'block';
                }
                document.getElementById('edit-name-btn').style.display = 'inline-block';
                authBtn.innerText = "登出";
                authBtn.className = "user-btn logout-btn";
            } else {
                currentUser = null;
                customName = null;
                usernameDisplay.innerText = "訪客";
                uidSubtext.innerText = "UID: 未登入";
                userAvatar.style.display = 'none';
                document.getElementById('edit-name-btn').style.display = 'none';
                authBtn.innerText = "Google 登入";
                authBtn.className = "user-btn";
            }
        });
    };

    function toggleAuth() {
        if (currentUser) {
            auth.signOut().then(() => {
                alert("已成功登出！");
            });
        } else {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                console.error("登入失敗:", error);
                alert("登入失敗，請重試！");
            });
        }
    }

    // 🎯 修改暱稱：即時更新雲端排行榜上該 UID 的所有名字
    function customPlayerName() {
        if (!currentUser) return;
        let defaultName = customName || currentUser.displayName || "匿名玩家";
        let newName = prompt("請輸入你想在排行榜顯示的遊戲暱稱（可與他人重複）：", defaultName);
        
        if (newName && newName.trim() !== "") {
            customName = newName.trim();
            localStorage.setItem('javelin_custom_name_' + currentUser.uid, customName);
            usernameDisplay.innerText = customName;
            
            // 立即同步雲端排行榜上該 UID 的名字
            db.collection("leaderboard").where("uid", "==", currentUser.uid).get().then((snapshot) => {
                snapshot.forEach((doc) => {
                    doc.ref.update({ name: customName });
                });
            });

            alert("暱稱修改成功！排行榜名字已即時同步更新。");
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!isPlaying) return;
        if (keyMap[e.key]) {
            e.preventDefault();
            handleInput(keyMap[e.key]);
        }
    });

    function startGame() {
        distance = 0.00;
        combo = 0;
        timeLeft = GAME_DURATION;
        currentRefreshRate = INITIAL_REFRESH;
        isPlaying = true;
        updateUI();
        startBtn.style.display = 'none';
        feedbackEl.innerText = '';

        gameTimer = setInterval(() => {
            timeLeft--;
            timeEl.innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);

        nextTarget();
    }

    function nextTarget() {
        if (!isPlaying) return;
        if (refreshTimer) clearTimeout(refreshTimer);

        let progress = (GAME_DURATION - timeLeft) / GAME_DURATION; 
        currentRefreshRate = Math.max(MIN_REFRESH, INITIAL_REFRESH - (progress * 750));
        speedEl.innerText = `等待: ${(currentRefreshRate / 1000).toFixed(2)}s`;

        let newTarget;
        do {
            newTarget = directions[Math.floor(Math.random() * directions.length)];
        } while (newTarget === currentTarget);
        
        currentTarget = newTarget;

        arrowEl.innerText = dirMap[currentTarget].icon;
        targetTextEl.innerText = dirMap[currentTarget].text;

        refreshTimer = setTimeout(() => {
            if (isPlaying) {
                combo = 0; 
                distance = Math.max(0, distance + PENALTY_TIMEOUT);
                updateUI();
                showFeedback('反應太慢！Combo斷了 -2.0m', 'wrong');
                nextTarget();
            }
        }, currentRefreshRate);
    }

    function handleInput(inputDir) {
        if (!isPlaying) return;
        if (refreshTimer) clearTimeout(refreshTimer);

        if (inputDir === currentTarget) {
            combo++;
            let bonus = (combo > 10) ? (combo * 0.12) : (combo * 0.05);
            let gain = BASE_DISTANCE + bonus;
            distance += gain;
            showFeedback(`精準！ +${gain.toFixed(2)}m`, 'correct');
        } else {
            combo = 0; 
            distance = Math.max(0, distance + PENALTY_WRONG);
            showFeedback('失誤爆扣！Combo歸零 -3.0m', 'wrong');
        }

        updateUI();
        nextTarget();
    }

    function updateUI() {
        distanceEl.innerText = distance.toFixed(2);
        comboEl.innerText = `Combo: ${combo}`;
    }

    function showFeedback(text, type) {
        feedbackEl.innerText = text;
        feedbackEl.className = 'feedback-text ' + type;
    }

    function endGame() {
        isPlaying = false;
        clearInterval(gameTimer);
        if (refreshTimer) clearTimeout(refreshTimer);
        
        arrowEl.innerText = '🏁';
        targetTextEl.innerText = '比賽結束！';
        
        let finalDist = parseFloat(distance.toFixed(2));
        
        if (currentUser) {
            uploadScoreToCloud(customName || currentUser.displayName || "匿名玩家", finalDist, currentUser.uid);
        } else {
            alert("你目前是訪客身份，登入 Google 帳號即可將成績登上全球排行榜！");
        }

        let evalText = (finalDist >= 98.48) ? '🏆 破世界紀錄！' : (finalDist >= 80) ? '🥇 奧運金牌！' : '🥉 繼續加油！';
        feedbackEl.innerText = `${evalText} (${finalDist}m)`;
        feedbackEl.className = 'feedback-text correct';
        startBtn.innerText = '重新挑戰';
        startBtn.style.display = 'block';
    }

    // 🎯 以 UID 為核心：確保同 UID 只保留最高分，且所有該 UID 的名字永遠保持最新
    function uploadScoreToCloud(name, score, uid) {
        if (!uid) return;
        const leaderboardRef = db.collection("leaderboard");
        
        leaderboardRef.where("uid", "==", uid).get().then((querySnapshot) => {
            if (!querySnapshot.empty) {
                querySnapshot.forEach((doc) => {
                    let docId = doc.id;
                    let oldScore = doc.data().score;
                    
                    let updateData = { name: name };
                    if (score > oldScore) {
                        updateData.score = score;
                        updateData.timestamp = firebase.firestore.FieldValue.serverTimestamp();
                    }
                    leaderboardRef.doc(docId).update(updateData);
                });
            } else {
                leaderboardRef.add({
                    name: name,
                    score: score,
                    uid: uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }).catch((error) => {
            console.error("雲端同步失敗: ", error);
        });
    }

    function listenToGlobalLeaderboard() {
        db.collection("leaderboard")
          .orderBy("score", "desc")
          .limit(5)
          .onSnapshot((snapshot) => {
              leaderboardList.innerHTML = '';
              let rank = 1;
              snapshot.forEach((doc) => {
                  let data = doc.data();
                  let shortUid = data.uid ? data.uid.substring(0, 6) : "guest";
                  let row = document.createElement('div');
                  row.className = 'leaderboard-item';
                  row.innerHTML = `
                      <div style="display: flex; align-items: center; gap: 8px;">
                          <span class="rank-number">${rank}.</span>
                          <div class="player-meta">
                              <span class="player-name">${data.name}</span>
                              <span class="player-uid">UID: ${shortUid}...</span>
                          </div>
                      </div>
                      <span style="color:#34d399; font-weight:bold; font-size:15px;">${data.score.toFixed(2)}m</span>
                  `;
                  leaderboardList.appendChild(row);
                  rank++;
              });
          });
    }
</script>

</body>
</html>
